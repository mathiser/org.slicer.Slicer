name: Check for new Slicer release

on:
  schedule:
    # Every Monday at 06:00 UTC. Slicer stable releases are infrequent
    # (roughly every few months), so this just needs to not miss one for long.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Check download.slicer.org for a newer stable release
        id: check
        run: |
          set -euo pipefail

          current_version=$(grep -oP 'Slicer-\K[\d.]+(?=-linux-amd64\.tar\.gz)' org.slicer.Slicer.yml | head -1)
          echo "Current version: $current_version"

          # Documented query interface (see the "Get older Slicer Preview
          # Releases" section on the page itself): filters the download
          # table down to a single stable Linux entry, instead of scraping
          # the full Windows/macOS/Linux x stable/preview table.
          page=$(curl -sf "https://download.slicer.org/?os=linux&stability=release")

          latest_version=$(grep -oP '<span class="header">\K[0-9.]+' <<< "$page" | head -1)
          bitstream_id=$(grep -oP '/bitstream/\K[a-f0-9]+' <<< "$page" | head -1)
          revision=$(grep -oP 'revision \K[0-9]+' <<< "$page" | head -1)
          build_date=$(grep -oP 'built \K[0-9-]+' <<< "$page" | head -1)

          if [ -z "$latest_version" ] || [ -z "$bitstream_id" ] || [ -z "$revision" ]; then
            echo "::error::Could not parse download.slicer.org — the page format may have changed. latest_version='$latest_version' bitstream_id='$bitstream_id' revision='$revision'"
            exit 1
          fi

          echo "Latest stable: $latest_version (revision $revision, built $build_date, bitstream $bitstream_id)"

          if [ "$latest_version" = "$current_version" ]; then
            echo "Already up to date."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "new_version=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest_version" >> "$GITHUB_OUTPUT"
          echo "bitstream=$bitstream_id" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Check whether a PR branch already exists
        if: steps.check.outputs.new_version == 'true'
        id: existing
        run: |
          set -euo pipefail
          branch="update-slicer-${{ steps.check.outputs.version }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            echo "Branch $branch already exists — skipping (a PR is presumably already open)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run update.sh
        if: steps.check.outputs.new_version == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          ./update.sh "${{ steps.check.outputs.version }}" "${{ steps.check.outputs.bitstream }}" "${{ steps.check.outputs.revision }}" "${{ steps.check.outputs.date }}"

      - name: Open pull request
        if: steps.check.outputs.new_version == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.existing.outputs.branch }}"
          version="${{ steps.check.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add org.slicer.Slicer.yml org.slicer.Slicer.metainfo.xml slicer.sh
          git commit -m "Update to Slicer ${version}"
          git push origin "$branch"

          gh pr create \
            --title "Update to Slicer ${version}" \
            --base master \
            --head "$branch" \
            --body "Automated update from download.slicer.org's stable release feed (revision ${{ steps.check.outputs.revision }}, built ${{ steps.check.outputs.date }}).

          Generated by \`./update.sh ${version} ${{ steps.check.outputs.bitstream }} ${{ steps.check.outputs.revision }} ${{ steps.check.outputs.date }}\`.

          CI on this PR runs the missing-library check and a real Xvfb launch smoke test. **Those still don't guarantee a real-world install works** — a previous release passed both and still crashed on an actual system-wide install (missing libGLU.so.1, fixed in 8d3f715). For anything beyond a trivial patch bump, consider downloading the built bundle and installing it for real before merging."
